<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Source for icon.png (VS Code needs a PNG). Re-render with: npm run icon -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2D3340"/>
      <stop offset="1" stop-color="#1C2029"/>
    </linearGradient>
    <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="9" fill="#3E8FD8" fill-opacity="0.45"/>
      <rect width="4.5" height="9" fill="#3E8FD8"/>
    </pattern>
  </defs>

  <!-- Editor window -->
  <rect x="8" y="8" width="240" height="240" rx="44" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="43.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.16"/>

  <!-- Gutter separator -->
  <rect x="78" y="40" width="3" height="176" rx="1.5" fill="#FFFFFF" fill-opacity="0.07"/>

  <!-- Change marks: saved (green), unsaved (yellow), reverted (blue, hatched) -->
  <rect x="50" y="44" width="18" height="60" rx="5" fill="#57A64A"/>
  <rect x="50" y="112" width="18" height="60" rx="5" fill="#EFD700"/>
  <rect x="50" y="180" width="18" height="28" rx="5" fill="url(#hatch)"/>

  <!-- Code lines -->
  <g fill="#C9D1DE">
    <rect x="96" y="48" width="112" height="20" rx="10" fill-opacity="0.9"/>
    <rect x="116" y="80" width="84" height="20" rx="10" fill-opacity="0.9"/>
    <rect x="116" y="116" width="104" height="20" rx="10" fill-opacity="0.9"/>
    <rect x="96" y="148" width="64" height="20" rx="10" fill-opacity="0.9"/>
    <rect x="96" y="184" width="96" height="20" rx="10" fill-opacity="0.35"/>
  </g>
</svg>
